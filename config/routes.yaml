# Vendor-initiated provisioning updates. Public by necessity (server-to-server,
# no browser session), authenticated by request signature instead of CSRF.
# GET/HEAD are routed on purpose so the handler can answer 405 with Allow: POST
# rather than letting Contao resolve the path as a missing page (404).
seo_studio.provisioning_callback:
    path: /rest/api/v1/seo-studio-license-updater
    defaults:
        _controller: VTinnovations\SeoStudio\Controller\ExchangeCallbackController
        _token_check: false
        _bypass_maintenance: true
    methods: [POST, GET, HEAD]

seo_studio.llms_txt:
    path: /llms.txt
    defaults:
        _controller: VTinnovations\SeoStudio\Controller\LlmsTxtController
        _scope: frontend
    methods: [GET]
